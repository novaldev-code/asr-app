  - '@better-auth/prisma-adapter@1.7.22'
  - '@better-auth/telemetry@1.7.22'
  - '@nestjs/common@12.5.0'
  - '@nestjs/core@12.5.0'
  - '@nestjs/platform-express@12.5.0'
  - '@nestjs/testing@12.5.0'
  - better-auth@1.7.22
