services:
  db:
    image: postgres:16-alpine
    container_name: app-online-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_online
    ports:
      - "5433:5432"
    volumes:
      - app_online_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_online"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_online_pgdata:
